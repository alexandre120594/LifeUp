services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifeup_user
      POSTGRES_PASSWORD: ASdf4268*
      POSTGRES_DB: lifeup_db
    ports:
      - "5433:5432"
    volumes:
      - lifeup-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeup_user -d lifeup_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: builder
    command: npx prisma db push
    environment:
      DATABASE_URL: postgresql://lifeup_user:ASdf4268*@db:5432/lifeup_db?schema=public
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lifeup_user:ASdf4268*@db:5432/lifeup_db?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  lifeup-postgres-data:
    external: true
